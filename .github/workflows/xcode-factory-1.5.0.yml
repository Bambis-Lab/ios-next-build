name: iOS Next 1.6.2 Factory OAuth MCP Verification IPA

on:
  push:
    branches:
      - feature/ios-next-factory-1.5.0-xcode27
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-next-factory-1.6.0-xcode27
  cancel-in-progress: false

jobs:
  xcode:
    uses: Bambis-Lab/platform-workflows/.github/workflows/apple-xcode-ci.yml@4593d93abbafb3703751ccd887e9bad98fb5d139
    with:
      runs-on: xcode-27
      artifact-name: IOSNext-1.6.2-FactoryMCP-build25-unsigned
      artifact-path: build/IOSNext.ipa
      xcode-command: |
        set -euo pipefail

        echo "=== FACTORY SOURCE SCOPE ==="
        BASE_SHA="75f127ddf27f620855ec190bd0282b69aad61401"
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        git cat-file -e "$BASE_SHA^{commit}"
        python3 Scripts/validate_factory_scope.py "$BASE_SHA"

        echo "=== PUBLIC FACTORY OAUTH METADATA (READ ONLY) ==="
        python3 Scripts/probe_factory_oauth_metadata.py

        echo "=== TOOLCHAIN ==="
        xcodebuild -version
        test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"
        if ! command -v xcodegen >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
        fi
        bash Scripts/prepare_wireguard_dependency.sh

        export CM_COMMIT="$(git rev-parse HEAD)"
        export EXPECTED_VERSION="1.6.2"
        export EXPECTED_BUILD="25"

        bash Scripts/prepare_free_sideload_project.sh
        python3 Scripts/validate_apple_final_acceptance_source.py
        grep -q 'FactoryOverviewView(ownerModel: ownerModel, runnerModel: runnerModel)' Sources/Features/Owner/OwnerControlView.swift
        grep -q 'FactoryAmbientBackground(kind: .runner)' Sources/Features/RunnerDashboardView.swift
        grep -q 'FactoryCommandDeck(' Sources/Features/Owner/Factory/FactoryOverviewView.swift
        grep -q 'factory-preview-entry' Sources/Features/AdminAreaView.swift
        grep -q 'preconnect-service-hub' Sources/App/AppRootView.swift
        grep -q 'preconnect-factory-root' Sources/Features/Owner/Factory/FactoryStandaloneView.swift
        test -f UITests/IndependentServicesUITests.swift
        grep -q 'code_challenge_method' Sources/Features/Owner/Factory/FactoryMCPService.swift
        test "$(grep -c '<key>UIUserInterfaceStyle</key>' Info.plist)" = "0"

        echo "=== UNSIGNED DEVICE IPA BUILD ==="
        rm -rf build
        mkdir -p build/Payload

        xcodebuild \
          -project IOSNext.xcodeproj \
          -scheme IOSNext \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

        APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/IOSNext.app"
        test -d "$APP_PATH"
        /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | grep -qx '1.6.2'
        /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | grep -qx '25'
        /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -qx 'de.nicofroeba16.iosnext'

        cp -R "$APP_PATH" build/Payload/IOSNext.app
        ( cd build && /usr/bin/zip -qry IOSNext.ipa Payload )
        test -s build/IOSNext.ipa
        /usr/bin/unzip -tq build/IOSNext.ipa
        echo "FACTORY_IPA_PACKAGE=PASS signing=UNSIGNED"
        shasum -a 256 build/IOSNext.ipa

        echo "=== FACTORY OAUTH/MCP CONTRACT + PRECONNECTION UI ACCEPTANCE ==="
        xcodebuild \
          -project IOSNext.xcodeproj \
          -scheme IOSNext \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 18 Pro Max,OS=27.0' \
          -parallel-testing-enabled NO \
          -only-testing:IOSNextTests/FactoryMCPIntegrationTests \
          -only-testing:IOSNextUITests/IndependentServicesUITests \
          -derivedDataPath build/UITestDerivedData \
          -resultBundlePath build/PreconnectionAcceptance.xcresult \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          test
        echo "FACTORY_OAUTH_MCP_MOCK_CONTRACT=PASS"
        echo "PRECONNECTION_ACCEPTANCE=PASS"
