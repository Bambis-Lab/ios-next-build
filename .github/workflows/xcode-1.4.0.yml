name: iOS Next 1.4.0 Final Acceptance Build

on:
  push:
    branches:
      - build/ios-next-1.4.0-xcode27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode:
    uses: Bambis-Lab/platform-workflows/.github/workflows/apple-xcode-ci.yml@4593d93abbafb3703751ccd887e9bad98fb5d139
    with:
      runs-on: xcode-27
      artifact-name: IOSNext-1.4.0-build20
      artifact-path: build/IOSNext.ipa
      xcode-command: |
        set -euo pipefail

        echo "=== PROVENANCE ==="
        cat SOURCE_SHA
        grep -q 'canonical_sha=187fd62f3b80d29969ca8c998ffc383f386ae8bb' SOURCE_SHA

        echo "=== TOOLCHAIN ==="
        xcodebuild -version
        test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"

        if ! command -v xcodegen >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
        fi

        bash Scripts/prepare_wireguard_dependency.sh

        export CM_COMMIT="187fd62f3b80d29969ca8c998ffc383f386ae8bb"
        export EXPECTED_VERSION="1.4.0"
        export EXPECTED_BUILD="20"

        bash Scripts/prepare_free_sideload_project.sh

        grep -q 'MARKETING_VERSION: 1.4.0' project.yml
        grep -q 'CURRENT_PROJECT_VERSION: 20' project.yml
        grep -q 'requiresOnDeviceRecognition = true' Sources/Core/JarvisEngine.swift
        grep -q 'AVAudioSession.didBecomeInactiveNotification' Sources/Core/JarvisEngine.swift
        grep -q 'AVAudioSession.resumptionRecommendationNotification' Sources/Core/JarvisEngine.swift
        grep -q 'AVAudioSession.routeChangeNotification' Sources/Core/JarvisEngine.swift
        grep -q 'NSProcessInfoPowerStateDidChange' Sources/Core/JarvisEngine.swift
        grep -q 'ProcessInfo.thermalStateDidChangeNotification' Sources/Core/JarvisEngine.swift
        grep -q 'AVAudioApplication.requestRecordPermission()' Sources/Core/JarvisEngine.swift
        grep -q 'JarvisEngine.shared.setApplicationActive(active)' Sources/App/IOSNextApp.swift
        grep -q 'IOSNextAppShortcuts.updateAppShortcutParameters()' Sources/App/IOSNextApp.swift
        grep -q 'OpenJarvisIntent: AppIntent' Sources/Core/JarvisAppIntents.swift
        grep -q 'static let openAppWhenRun = true' Sources/Core/JarvisAppIntents.swift
        grep -q 'APPLE_FINAL_ACCEPTANCE=PASS' Scripts/validate_apple_final_acceptance_source.py
        python3 Scripts/validate_apple_final_acceptance_source.py

        rm -rf build
        mkdir -p build/Payload

        xcodebuild \
          -project IOSNext.xcodeproj \
          -scheme IOSNext \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

        APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/IOSNext.app"
        test -d "$APP_PATH"

        /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | grep -qx '1.4.0'
        /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | grep -qx '20'

        cp -R "$APP_PATH" build/Payload/IOSNext.app
        cd build
        /usr/bin/zip -qry IOSNext.ipa Payload
        cd ..

        test -s build/IOSNext.ipa
        echo "=== IPA ==="
        ls -lh build/IOSNext.ipa
        shasum -a 256 build/IOSNext.ipa
