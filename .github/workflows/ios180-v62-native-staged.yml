name: V6.3 staged native independent WSS acceptance
on:
  push:
    branches: ['feature/ios180-v62-native-staged-call']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios180-v63-native-staged-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native30:
    uses: ./.github/workflows/ios180-v62-native-stage.yml
    with:
      duration: 30
  native120:
    needs: native30
    uses: ./.github/workflows/ios180-v62-native-stage.yml
    with:
      duration: 120
  native300:
    needs: native120
    uses: ./.github/workflows/ios180-v62-native-stage.yml
    with:
      duration: 300
