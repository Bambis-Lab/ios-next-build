name: iOS Next 1.7.3 Integration G99
on:
  push:
    branches:
      - feature/iosnext-173-integration-00-07
      - fix/iosnext-173-relay-longpoll-timeout
      - fix/iosnext-173-chat-transport-security
      - diagnostic/iosnext-173-factory-oauth-readonly
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios173-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify source lock, Chat settings route, OAuth and Live fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui = Path("Sources/Features/SystemView.swift").read_text()
          admin = Path("Sources/Features/AdminAreaView.swift").read_text()
          backend = Path("Sources/Core/FamilyBootstrapClient.swift").read_text()
          model = Path("Sources/Core/AppModel.swift").read_text()
          tests = Path("Tests/FamilyIdentityTests.swift").read_text()
          assert "enum OwnerServiceNavigationPolicy" in ui
          assert "if familyBrokerConfigured { return registeredProfile == .nico }" in ui
          assert "return hasHAIdentity && selectedProfile == .nico" in ui
          assert "system-factory-workspace" in ui and "system-runner-dashboard" in ui
          assert "system-owner-control" in ui and "system-live-operations" in ui
          assert "system-owner-recovery" in ui
          assert "appModel?.registeredFamilyProfile != .nico" in admin
          assert "model.clearFamilyOwnerSession()" in admin
          assert "role == \"owner\" && self.haUserID == haUserID && self.deviceID == deviceID" in backend
          assert 'role == "member" && profile != .nico' in backend
          assert "selectedProfile = .nico" in model
          for name in (
              "testLegacyPersonalNavigationRestoresOwnerModulesAfterHALogin",
              "testFamilyMemberNeverReceivesOwnerNavigationFromSelectedProfile",
              "testVerifiedNicoNavigationIsIndependentOfRunnerOrFactoryConnectivity",
              "testUnverifiedFamilyIdentityOnlyOffersOwnerRecovery",
          ):
              assert "func " + name in tests, name
          chat = Path("Sources/Features/ChatInboxView.swift").read_text()
          settings = Path("Sources/Features/ChatSettingsView.swift").read_text()
          live = Path("Sources/Core/LiveOperationsClient.swift").read_text()
          oauth = Path("Sources/Features/Owner/Factory/FactoryMCPService.swift").read_text()
          ui_tests = Path("UITests/IndependentServicesUITests.swift").read_text()
          assert "showingChatSettings = true" in chat
          assert "ChatSettingsView(appModel: appModel, chatModel: chatModel)" in chat
          assert "navigationDestination(item: $destination) { selected in" in chat
          assert "Chat-Einstellungen" in settings and "chat-settings-offline-reason" in settings
          assert 'app.navigationBars["Chat-Einstellungen"]' in ui_tests
          assert 'XCTAttachment(screenshot: app.screenshot())' in ui_tests
          assert "registrationRejected(Int)" in oauth
          assert "class FactoryNoRedirects" in oauth and "completionHandler(nil)" in oauth
          assert "configuration: .ephemeral," in oauth and "delegate: FactoryNoRedirects()" in oauth
          assert "testOAuthTransportRefusesOffOriginRedirectsIncluding307TokenPost" in Path("Tests/FactoryMCPIntegrationTests.swift").read_text()
          assert "incompatibleRunnerStream" in live
          relay = Path("Sources/Core/ChatRelayClient.swift").read_text()
          chatmodel = Path("Sources/Core/ChatModel.swift").read_text()
          chattests = Path("Tests/ChatDraftSafetyTests.swift").read_text()
          assert "class ChatRelayNoRedirects" in relay
          assert "completionHandler(nil)" in relay
          assert "delegate: ChatRelayNoRedirects()" in relay
          assert "ChatContactDiscoveryPolicy.mayUseLegacyRecipient" in chatmodel
          assert "testChatRelayAlwaysRefusesTokenBearingHTTPRedirects" in chattests
          assert "testFamilyContactsAreNeverInventedWhenBrokerDiscoveryFails" in chattests
          inbox = Path("Sources/Features/ChatInboxView.swift").read_text()
          assert "ChatTicketVisibilityPolicy.ownerEntry" in inbox
          assert "familyBrokerConfigured && verifiedProfile == .nico" in inbox
          assert "Owner tickets use the *independently approved* Admin backend" in inbox
          assert "testNicoOwnerTicketEntryUsesVerifiedIdentityNotElevatedChatToken" in chattests
          assert "testMemberTicketsRequireVerifiedMemberWhenFamilyBrokerIsConfigured" in chattests
          assert "enum ChatRelayPollingPolicy" in relay
          assert "serverWaitSeconds = 25" in relay
          assert "longPollRequestTimeout: TimeInterval = 42" in relay
          assert "sessionResourceTimeout: TimeInterval = 55" in relay
          assert "request.timeoutInterval = ChatRelayPollingPolicy.timeout" in relay
          assert "testQuietFamilyChatLongPollDoesNotTimeoutBeforeBackendResponse" in chattests
          assert "testOnlyAuthenticatedMessageReceiveLongPollGetsExtendedTimeout" in chattests
          print("IOS173_INTEGRATION_SOURCE=PASS; CHAT_ROUTING_FIXED; OWNER_BYPASS=DENIED; LIVE_E2E=UNVERIFIED")
          PY

  xcode27:
    needs: source
    runs-on: xcode-27
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve simulator and generate project without cold boot
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          xcodegen generate --spec project.yml --project .
          mkdir -p build/ios173
          python3 Scripts/Acceptance/boot_simulator.py "iPhone 18 Pro Max" "iOS-27-0" --resolve-only 2>&1 | tee build/ios173/resolve.log
          printf 'src=%s\nrunner=%s\n' "$GITHUB_SHA" "$RUNNER_NAME" > build/ios173/environment.txt
      - name: Build targeted XCTest bundle before cold simulator startup
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -collect-test-diagnostics never \
            -project IOSNext.xcodeproj -scheme IOSNext -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -derivedDataPath build/ios173/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" \
            2>&1 | tee build/ios173/BuildForTesting.log
          XCTESTRUN_PATH="$(find build/ios173/DerivedData/Build/Products -maxdepth 1 -type f -name '*.xctestrun' -print -quit)"
          test -s "$XCTESTRUN_PATH"
          echo "XCTESTRUN_PATH=$XCTESTRUN_PATH" >> "$GITHUB_ENV"
          echo "IOS173_INTEGRATION_BUILD=PASS"
      - name: Confirm iPhone runtime is actually booted after build warmup
        shell: bash
        run: |
          set -euo pipefail
          # Old flow started the cold iOS 27 simulator before compiling and
          # timed out at 210 seconds. Warm up the Xcode build first; do not
          # erase global simulator state or treat an unbooted device as a PASS.
          if IOSNEXT_BOOTSTATUS_TIMEOUT_SECONDS=240 python3 Scripts/Acceptance/boot_simulator.py "iPhone 18 Pro Max" "iOS-27-0" > build/ios173/boot.log 2>&1; then
            cat build/ios173/boot.log
            echo "IOS173_INTEGRATION_BOOT=PASS"
          else
            cat build/ios173/boot.log
            xcrun simctl list devices available || true
            echo "::error::iOS 27 Simulator did not boot; XCTest correctly blocked"
            exit 1
          fi
      - name: Execute family authorization and navigation XCTest
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -collect-test-diagnostics never \
            -xctestrun "$XCTESTRUN_PATH" -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -resultBundlePath build/ios173/OwnerNavigation.xcresult \
            '-only-testing:IOSNextTests/FamilyIdentityTests' \
            '-only-testing:IOSNextTests/FactoryMCPIntegrationTests' \
            '-only-testing:IOSNextTests/LiveOperationsTests' \
            '-only-testing:IOSNextTests/ChatDraftSafetyTests' \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" \
            2>&1 | tee build/ios173/OwnerNavigation.log
          for suite in FamilyIdentityTests FactoryMCPIntegrationTests LiveOperationsTests ChatDraftSafetyTests; do
            grep -Fq "Test Suite '$suite' passed" build/ios173/OwnerNavigation.log
          done
          grep -Eq '\*\* TEST (EXECUTE )?SUCCEEDED \*\*' build/ios173/OwnerNavigation.log
          echo "IOS173_INTEGRATION_XCTEST=PASS"
      - name: Smoke-test existing Factory entry and family member UI guards
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -collect-test-diagnostics never \
            -xctestrun "$XCTESTRUN_PATH" -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -resultBundlePath build/ios173/IndependentServices.xcresult \
            '-only-testing:IOSNextUITests/IndependentServicesUITests/testAllServiceEntriesWorkWithoutHomeAssistant' \
            '-only-testing:IOSNextUITests/FamilyOnboardingUITests/testMikaFamilyPreview' \
            '-only-testing:IOSNextUITests/FamilyOnboardingUITests/testJuliFamilyPreview' \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" \
            2>&1 | tee build/ios173/IndependentServices.log
          grep -Fq "testAllServiceEntriesWorkWithoutHomeAssistant" build/ios173/IndependentServices.log
          grep -Fq "testMikaFamilyPreview" build/ios173/IndependentServices.log
          grep -Fq "testJuliFamilyPreview" build/ios173/IndependentServices.log
          grep -Eq '\*\* TEST (EXECUTE )?SUCCEEDED \*\*' build/ios173/IndependentServices.log
          echo "IOS173_INTEGRATION_UI_SMOKE=PASS"
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IOS173-Integration-Xcode27-Evidence
          path: |
            build/ios173/BuildForTesting.log
            build/ios173/OwnerNavigation.log
            build/ios173/OwnerNavigation.xcresult
            build/ios173/IndependentServices.log
            build/ios173/IndependentServices.xcresult
            build/ios173/resolve.log
            build/ios173/boot.log
            build/ios173/environment.txt
          retention-days: 14
          if-no-files-found: warn
