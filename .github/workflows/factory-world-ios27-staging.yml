name: Factory World iOS27 compile-only staging
on:
  push:
    branches: [feature/factory-world-ios27-staging]
    paths:
      - "Sources/Features/Owner/Factory/FactoryWorld*.swift"
      - ".github/workflows/factory-world-ios27-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-world-ios27-stage
  cancel-in-progress: false
jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact Apple toolchain and isolated branch
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"
          git status --short
          test "$GITHUB_REF_NAME" = "feature/factory-world-ios27-staging"
      - name: Typecheck only new native Factory World files against Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/FactoryWorldSurfaceShim.swift" <<'SWIFT'
          import SwiftUI
          extension View {
              func ios27ContentSurface(radius: CGFloat) -> some View { self }
          }
          SWIFT
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swiftc -typecheck \
            -target arm64-apple-ios27.0 -sdk "$SDK" \
            "$RUNNER_TEMP/FactoryWorldSurfaceShim.swift" \
            Sources/Features/Owner/Factory/FactoryWorldAssets.swift \
            Sources/Features/Owner/Factory/FactoryWorldView.swift
          echo "FW03_WORLD_FILES_TYPECHECK=PASS;FULL_APP_BUILD_NOT_ATTESTED"
