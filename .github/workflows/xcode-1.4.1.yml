name: iOS Next 1.4.1 Controls Hotfix Build

on:
  push:
    branches:
      - build/ios-next-1.4.1-xcode27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode:
    uses: Bambis-Lab/platform-workflows/.github/workflows/apple-xcode-ci.yml@4593d93abbafb3703751ccd887e9bad98fb5d139
    with:
      runs-on: xcode-27
      artifact-name: IOSNext-1.4.1-build21
      artifact-path: build/IOSNext.ipa
      xcode-command: |
        set -euo pipefail

        echo "=== TOOLCHAIN ==="
        xcodebuild -version
        test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.0"

        if ! command -v xcodegen >/dev/null 2>&1; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
        fi

        bash Scripts/prepare_wireguard_dependency.sh

        export CM_COMMIT="187fd62f3b80d29969ca8c998ffc383f386ae8bb"
        export EXPECTED_VERSION="1.4.1"
        export EXPECTED_BUILD="21"

        bash Scripts/prepare_free_sideload_project.sh

        grep -q 'MARKETING_VERSION: 1.4.1' project.yml
        grep -q 'CURRENT_PROJECT_VERSION: 21' project.yml

        echo "=== HOTFIX ACCEPTANCE ==="
        grep -q '@State private var draftVolume' Sources/Design/MediaControlSheet.swift
        grep -q 'if !editing {' Sources/Design/MediaControlSheet.swift
        grep -q 'MediaSeekControl' Sources/Design/MediaControlSheet.swift
        grep -q '@State private var draftBrightness' Sources/Features/RoomsView.swift
        grep -q 'entity.supportsColor ? "paintpalette.fill"' Sources/Features/RoomsView.swift

        # Juli TV background coupling must remain guarded.
        grep -q 'private var tvAllowsLight: Bool { tv?.isOn == true }' Sources/Features/RoomsView.swift
        grep -q 'private var canToggle: Bool { light.isOn || tvAllowsLight }' Sources/Features/RoomsView.swift
        grep -q 'canTurnOn: tvAllowsLight' Sources/Features/RoomsView.swift
        grep -q 'Nur bei eingeschaltetem Juli TV' Sources/Features/RoomsView.swift

        # Control Center keeps haptics but no longer owns an AVAudioPlayer sound profile.
        python3 - <<'PY'
        from pathlib import Path
        source = Path("Sources/Design/IOSNextFeedback.swift").read_text()
        block = source.split("private func soundProfile", 1)[1].split("private func playSound", 1)[0]
        assert "case .controlCenterUnlock:\n            nil" in block
        PY

        python3 Scripts/validate_apple_final_acceptance_source.py

        rm -rf build
        mkdir -p build/Payload

        xcodebuild \
          -project IOSNext.xcodeproj \
          -scheme IOSNext \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

        APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/IOSNext.app"
        test -d "$APP_PATH"

        /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | grep -qx '1.4.1'
        /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | grep -qx '21'

        cp -R "$APP_PATH" build/Payload/IOSNext.app
        cd build
        /usr/bin/zip -qry IOSNext.ipa Payload
        cd ..

        test -s build/IOSNext.ipa
        echo "=== IPA ==="
        ls -lh build/IOSNext.ipa
        shasum -a 256 build/IOSNext.ipa
