name: G99 iOS Next 1.6.4 Full UI Acceptance
on:
  push:
    branches:
      - fix/iosnext-164-dashboard-sliders-fix01-05
    paths:
      - '.github/workflows/g99-ios-next-164-acceptance.yml'
  workflow_dispatch:
# G99 verification: test-only timeout hardening and server trace on failure.
permissions:
  contents: read
concurrency:
  group: g99-iosnext-164-${{ github.ref }}
  cancel-in-progress: true
jobs:
  g99-a:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Source lock and test inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('UITests/IOSNextUITests.swift').read_text()
          required=['testPrimaryProductScreensRenderLightAndDark','testNativeTabNavigationAndMediaDetail','testChatComposerInteraction','testLightSliderInteraction','testAccessibilityCoreScreenRenders','testDynamicTypeAccessibilityState','testReduceMotionAccessibilityState','testReduceTransparencyAccessibilityState','testIncreaseContrastAccessibilityState','testIPadPortraitLandscapeCoreScreens']
          assert all(x in src for x in required)
          assert Path('Tests/SliderValueReconcilerFixTests.swift').exists()
          print('G99_SOURCE_LOCK=PASS')
          PY
  g99-b:
    needs: g99-a
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare project and simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          if ! command -v xcodegen >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          bash Scripts/prepare_wireguard_dependency.sh
          export CM_COMMIT="$(git rev-parse HEAD)" EXPECTED_VERSION=1.6.4 EXPECTED_BUILD=27
          bash Scripts/prepare_free_sideload_project.sh
          mkdir -p build/g99
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x["udid"] for k,v in d.items() if "iOS-27" in k for x in v if x["name"]=="iPhone 18 Pro Max" and x.get("isAvailable",True)]; assert a; print(a[0])')"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
      - name: Compile and full unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Keep the fake server in the same Actions step as xcodebuild:
          # runner cleanup may terminate background processes between steps.
          python3 Scripts/fake_ha_websocket_server.py --host 127.0.0.1 --port 18765 > build/g99/fake-ha.log 2>&1 &
          FAKE_HA_PID=$!
          trap 'kill "$FAKE_HA_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket,time
          for i in range(60):
              try:
                  with socket.create_connection(('127.0.0.1',18765),timeout=1):
                      print('G99_FAKE_HA_READY=PASS');break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('G99_FAKE_HA_READY=FAIL')
          PY
          kill -0 "$FAKE_HA_PID"
          # Print server-side handshake and message trace even when xcodebuild fails.
          trap 'status=$?; echo "=== Fake HA server trace ==="; cat build/g99/fake-ha.log || true; kill "$FAKE_HA_PID" 2>/dev/null || true; exit "$status"' EXIT
          xcodebuild test -collect-test-diagnostics never -project IOSNext.xcodeproj -scheme IOSNext -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIM_ID" -parallel-testing-enabled NO -disable-concurrent-destination-testing -derivedDataPath build/g99/DerivedData -resultBundlePath build/g99/Unit.xcresult '-only-testing:IOSNextTests' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/g99/Unit.log
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: G99-164-Unit
          path: build/g99/
          retention-days: 14
  g99-ui:
    needs: [g99-a, g99-b]
    if: needs.g99-a.result == 'success' && needs.g99-b.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare project and simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          if ! command -v xcodegen >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          bash Scripts/prepare_wireguard_dependency.sh
          export CM_COMMIT="$(git rev-parse HEAD)" EXPECTED_VERSION=1.6.4 EXPECTED_BUILD=27
          bash Scripts/prepare_free_sideload_project.sh
          mkdir -p build/g99
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; device="${{ matrix.device }}"; a=[x["udid"] for k,v in d.items() if "iOS-27" in k for x in v if x.get("isAvailable",True) and (x["name"]=="iPhone 18 Pro Max" if device=="iphone" else x["name"].startswith("iPad"))]; assert a; print(a[0])')"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          export SIM_ID
          STATE="$(xcrun simctl list devices -j | python3 -c 'import json,sys,os; d=json.load(sys.stdin)["devices"]; uid=os.environ["SIM_ID"]; print(next((x.get("state","") for v in d.values() for x in v if x["udid"]==uid),""))' )"
          if [ "$STATE" != "Booted" ]; then xcrun simctl boot "$SIM_ID"; fi
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl ui "$SIM_ID" appearance
      - name: UI interaction, light and dark, accessibility
        shell: bash
        run: |
          set -euo pipefail
          for MODE in light dark; do
            xcrun simctl ui "$SIM_ID" appearance "$MODE"
            xcodebuild test -collect-test-diagnostics never -project IOSNext.xcodeproj -scheme IOSNext -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIM_ID" -parallel-testing-enabled NO -derivedDataPath build/g99/DerivedData -resultBundlePath "build/g99/UI-$MODE.xcresult" '-only-testing:IOSNextUITests/IOSNextUITests/testPrimaryProductScreensRenderLightAndDark' '-only-testing:IOSNextUITests/IOSNextUITests/testNativeTabNavigationAndMediaDetail' '-only-testing:IOSNextUITests/IOSNextUITests/testChatComposerInteraction' '-only-testing:IOSNextUITests/IOSNextUITests/testLightSliderInteraction' '-only-testing:IOSNextUITests/IOSNextUITests/testOwnerAndWireGuardSafeEntryStates' '-only-testing:IOSNextUITests/IOSNextUITests/testLiveOperationsSafeEntryState' '-only-testing:IOSNextUITests/IOSNextUITests/testAccessibilityCoreScreenRenders' '-only-testing:IOSNextUITests/IOSNextUITests/testDynamicTypeAccessibilityState' '-only-testing:IOSNextUITests/IOSNextUITests/testReduceMotionAccessibilityState' '-only-testing:IOSNextUITests/IOSNextUITests/testReduceTransparencyAccessibilityState' '-only-testing:IOSNextUITests/IOSNextUITests/testIncreaseContrastAccessibilityState' '-only-testing:IOSNextUITests/IOSNextUITests/testIPadPortraitLandscapeCoreScreens' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee "build/g99/UI-$MODE.log"
            mkdir -p "build/g99/screenshots/$MODE"
            xcrun xcresulttool export attachments --path "build/g99/UI-$MODE.xcresult" --output-path "build/g99/screenshots/$MODE"
          done
          echo "G99_UI_ACCEPTANCE=PASS device=${{ matrix.device }}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: G99-164-${{ matrix.device }}-UI-Evidence
          path: build/g99/
          retention-days: 14
          if-no-files-found: warn
