name: IPH Block B iPhone targeted UI verification

# Targeted verification is triggered only when this workflow file changes.
# G99 remains manual-only and is not invoked here.
on:
  push:
    branches:
      - fix/iosnext-164-dashboard-sliders-fix01-05
    paths:
      - '.github/workflows/iph-block-b-iphone-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iph-block-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iphone-targeted-ui:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare Xcode 27 iPhone-only project
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/iosnext-164-dashboard-sliders-fix01-05"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Structural regression guard: retired VPN code and tunnel extension must not reappear.
          test ! -d WireGuard
          test ! -e Sources/Features/WireGuardView.swift
          test ! -e Sources/Core/WireGuardTunnelController.swift
          ! grep -q 'IOSNextPacketTunnel' project.yml
          ! grep -q 'WireGuardKit' project.yml
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          if ! command -v xcodegen >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          export CM_COMMIT="$(git rev-parse HEAD)" EXPECTED_VERSION=1.6.4 EXPECTED_BUILD=27
          bash Scripts/prepare_free_sideload_project.sh
          mkdir -p build/iph-b
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x["udid"] for k,v in d.items() if "iOS-27" in k for x in v if x.get("isAvailable",True) and x["name"]=="iPhone 18 Pro Max"]; assert a, "iPhone 18 Pro Max iOS 27 required"; print(a[0])')"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          # Boot the selected iPhone *before* any XCUITest launch.
          # The existing helper applies a 90-second watchdog to bootstatus.
          python3 Scripts/Acceptance/boot_simulator.py "iPhone 18 Pro Max" "iOS-27-0"             2>&1 | tee build/iph-b/simulator-boot.log
          xcrun simctl ui "$SIM_ID" appearance light
          {
            printf 'run_id=%s\nbranch=%s\nsha=%s\nsimulator=%s\n' "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$SIM_ID"
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } > build/iph-b/environment.txt 2>&1
          xcrun simctl help ui > build/iph-b/simctl-ui-help.txt 2>&1 || true
      - name: B-06 build for testing and controlled simulator prelaunch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/iosnext-164-dashboard-sliders-fix01-05"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "B06_BUILD_FOR_TESTING_BEGIN"
          xcodebuild build-for-testing -collect-test-diagnostics never \
            -project IOSNext.xcodeproj -scheme IOSNext -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/iph-b/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/iph-b/BuildForTesting.log
          APP_PATH="build/iph-b/DerivedData/Build/Products/Debug-iphonesimulator/IOSNext.app"
          test -d "$APP_PATH"
          XCTESTRUN_PATH="$(find build/iph-b/DerivedData/Build/Products -maxdepth 1 -type f -name '*.xctestrun' -print -quit)"
          test -n "$XCTESTRUN_PATH"
          echo "B06_BUILD_FOR_TESTING_PASS"
          echo "B06_PREWARM_INSTALL_BEGIN"
          xcrun simctl install "$SIM_ID" "$APP_PATH" 2>&1 | tee build/iph-b/prewarm-install.log
          echo "B06_PREWARM_LAUNCH_BEGIN"
          xcrun simctl launch --terminate-running-process "$SIM_ID" de.nicofroeba16.iosnext             --product-ui-test-screen=light 2>&1 | tee build/iph-b/prewarm-launch.log
          # This process start is only a startup smoke check, not slider acceptance.
          sleep 2
          xcrun simctl io "$SIM_ID" screenshot build/iph-b/prewarm-screen.png             > build/iph-b/prewarm-screenshot.log 2>&1 || true
          xcrun simctl terminate "$SIM_ID" de.nicofroeba16.iosnext             > build/iph-b/prewarm-terminate.log 2>&1 || true
          echo "B06_PREWARM_PROCESS_LAUNCHED" | tee -a build/iph-b/environment.txt
      - name: Run only three previously failing iPhone UI scenarios
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/iosnext-164-dashboard-sliders-fix01-05"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          set +e
          XCTESTRUN_PATH="$(find build/iph-b/DerivedData/Build/Products -maxdepth 1 -type f -name '*.xctestrun' -print -quit)"
          test -n "$XCTESTRUN_PATH"
          printf 'test_execution=test-without-building\nxctestrun=%s\n' "$XCTESTRUN_PATH" >> build/iph-b/environment.txt
          xcodebuild test-without-building -collect-test-diagnostics never \
            -xctestrun "$XCTESTRUN_PATH" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -resultBundlePath build/iph-b/Targeted.xcresult \
            '-only-testing:IOSNextUITests/IOSNextUITests/testNativeTabNavigationAndMediaDetail' \
            '-only-testing:IOSNextUITests/IOSNextUITests/testLiveOperationsSafeEntryState' \
            '-only-testing:IOSNextUITests/IOSNextUITests/testLightSliderInteraction' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/iph-b/Targeted.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          printf 'xcodebuild_status=%s\nsha=%s\n' "$TEST_STATUS" "$(git rev-parse HEAD)" >> build/iph-b/environment.txt
          if [ "$TEST_STATUS" -ne 0 ]; then
            xcrun simctl io "$SIM_ID" screenshot build/iph-b/simulator-final.png > build/iph-b/screenshot-status.txt 2>&1 || true
            xcrun simctl spawn "$SIM_ID" log show --last 5m --style compact --predicate 'process == "IOSNext" OR process == "IOSNextUITests-Runner"' > build/iph-b/iosnext-system.log 2>&1 || true
          fi
          if [ -d build/iph-b/Targeted.xcresult ]; then
            mkdir -p build/iph-b/attachments
            xcrun xcresulttool export attachments --path build/iph-b/Targeted.xcresult --output-path build/iph-b/attachments > build/iph-b/attachment-export.log 2>&1 || true
          fi
          exit "$TEST_STATUS"
      - name: Preserve targeted iPhone failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IPH-Block-B-iPhone-Targeted-Evidence
          path: |
            build/iph-b/Targeted.log
            build/iph-b/Targeted.xcresult
            build/iph-b/simulator-boot.log
            build/iph-b/BuildForTesting.log
            build/iph-b/prewarm-install.log
            build/iph-b/prewarm-launch.log
            build/iph-b/prewarm-screen.png
            build/iph-b/prewarm-screenshot.log
            build/iph-b/prewarm-terminate.log
            build/iph-b/environment.txt
            build/iph-b/simctl-ui-help.txt
            build/iph-b/screenshot-status.txt
            build/iph-b/simulator-final.png
            build/iph-b/iosnext-system.log
            build/iph-b/attachment-export.log
            build/iph-b/attachments/
          retention-days: 14
          if-no-files-found: warn
