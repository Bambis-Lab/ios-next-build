name: iOS173 diagnostic compilation (NOT release)
on:
  push:
    branches: ['feature/ios173-n00-n08-cloud']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated SDK 26 diagnostic project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios173-diag" build/diagnostic26
          xcodebuild -version | tee build/diagnostic26/toolchain.log
          test "$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)" = 26
          rsync -a --exclude=.git --exclude=build ./ "$RUNNER_TEMP/ios173-diag/"
          cd "$RUNNER_TEMP/ios173-diag"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("project.yml")
          s=p.read_text()
          assert s.count("IPHONEOS_DEPLOYMENT_TARGET: 27.0")==1
          p.write_text(s.replace("IPHONEOS_DEPLOYMENT_TARGET: 27.0","IPHONEOS_DEPLOYMENT_TARGET: 26.0"))
          # Adapt only this disposable SDK26 project; production sources stay untouched.
          p=Path("Sources/Core/InMemoryVoiceRecorder.swift")
          s=p.read_text()
          old="try input.installAudioTap(onBus: 0, bufferSize: 1_024, format: format)"
          assert s.count(old)==1 and s.count("accumulator.append(AVAudioPCMBuffer(copying: buffer))")==1
          p.write_text(s.replace(old,"input.installTap(onBus: 0, bufferSize: 1_024, format: format)").replace("accumulator.append(AVAudioPCMBuffer(copying: buffer))","accumulator.append(buffer)"))
          p=Path("Sources/Core/JarvisEngine.swift")
          s=p.read_text()
          begin=s.index("        notificationTokens.append(center.addObserver(\n            forName: AVAudioSession.didBecomeInactiveNotification,")
          end=s.index("        notificationTokens.append(center.addObserver(\n            forName: AVAudioSession.routeChangeNotification,",begin)
          # These two iOS27-specific notifications are excluded, not emulated.
          p.write_text(s[:begin]+s[end:])
          print("SDK26 diagnostic substitutions: legacy recorder tap; two iOS27-only notifications excluded")
          PY
          diff -u "$GITHUB_WORKSPACE/Sources/Core/InMemoryVoiceRecorder.swift" Sources/Core/InMemoryVoiceRecorder.swift > "$GITHUB_WORKSPACE/build/diagnostic26/recorder.diff" || test "$?" = 1
          diff -u "$GITHUB_WORKSPACE/Sources/Core/JarvisEngine.swift" Sources/Core/JarvisEngine.swift > "$GITHUB_WORKSPACE/build/diagnostic26/jarvis.diff" || test "$?" = 1
          if ! command -v xcodegen >/dev/null; then HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen; fi
          python3 -m venv "$RUNNER_TEMP/ios173-audio-venv"
          "$RUNNER_TEMP/ios173-audio-venv/bin/python" -m pip install cryptography==46.0.5 websockets==15.0.1
          "$RUNNER_TEMP/ios173-audio-venv/bin/python" Scripts/Acceptance/audio_network_fixture.py generate Tests/FamilyAudioNetworkTests.swift
          xcodegen generate --spec project.yml --project .
      - name: Compile diagnostic app and unit tests
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ios173-diag"
          xcodebuild build-for-testing -project IOSNext.xcodeproj -scheme IOSNext -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios173-dd" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" 2>&1 | tee "$GITHUB_WORKSPACE/build/diagnostic26/compiler.log"
      - name: Run diagnostic unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > build/diagnostic26/devices.json
          SIM_ID="$(python3 - <<'PY'
          import json
          d=json.load(open("build/diagnostic26/devices.json"))["devices"]
          print(next(x["udid"] for r in sorted(d,reverse=True) if ".iOS-26-" in r for x in d[r] if x.get("isAvailable") and x["name"].startswith("iPhone")))
          PY
          )"
          echo "$SIM_ID" > build/diagnostic26/simulator-id.txt
          python3 Scripts/fake_ha_websocket_server.py --host 127.0.0.1 --port 18765 > build/diagnostic26/fake-ha.log 2>&1 &
          fixture_pid=$!
          "$RUNNER_TEMP/ios173-audio-venv/bin/python" Scripts/Acceptance/audio_network_fixture.py serve > build/diagnostic26/audio-fixture.log 2>&1 &
          audio_pid=$!
          trap 'kill "$fixture_pid" "$audio_pid" 2>/dev/null || true; wait "$fixture_pid" "$audio_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            kill -0 "$audio_pid"
            if grep -q SYNTHETIC_AUDIO_READY build/diagnostic26/audio-fixture.log; then break; fi
            sleep 0.25
          done
          grep -q SYNTHETIC_AUDIO_READY build/diagnostic26/audio-fixture.log
          python3 Scripts/Acceptance/preflight_fake_ha.py --attempts 20 | tee build/diagnostic26/preflight.log
          kill -0 "$fixture_pid"
          cd "$RUNNER_TEMP/ios173-diag"
          xcodebuild test -project IOSNext.xcodeproj -scheme IOSNext -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath "$RUNNER_TEMP/ios173-dd" -parallel-testing-enabled NO -only-testing:IOSNextTests -resultBundlePath "$GITHUB_WORKSPACE/build/diagnostic26/UnitTests.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY="-" 2>&1 | tee "$GITHUB_WORKSPACE/build/diagnostic26/tests.log"
      - name: Diagnostic simulator install and launch evidence
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          SIM_ID="$(cat build/diagnostic26/simulator-id.txt)"
          xcrun simctl bootstatus "$SIM_ID" -b
          APP="$RUNNER_TEMP/ios173-dd/Build/Products/Debug-iphonesimulator/IOSNext.app"
          test -d "$APP"
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl terminate "$SIM_ID" de.nicofroeba16.iosnext || true
          xcrun simctl launch "$SIM_ID" de.nicofroeba16.iosnext | tee build/diagnostic26/launch.log
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot build/diagnostic26/diagnostic-launch.png
      - name: Preserve non-release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IOS173-SDK26-DIAGNOSTIC-NOT-RELEASE
          path: build/diagnostic26
          retention-days: 14
