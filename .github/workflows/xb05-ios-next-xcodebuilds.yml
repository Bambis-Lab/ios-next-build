# XB-05 isolated diagnostic PR: unsigned iPhone 18 Pro Max iOS 27 acceptance only
name: XB-05 iOS Next V01-V04 XcodeBuilds Acceptance

on:
  push:
    branches:
      - visual/ios-next-162-v01-v04
    paths:
      - '.github/workflows/xb05-ios-next-xcodebuilds.yml'
      - 'Scripts/package_improvement_screenshots.py'
      - 'UITests/ImprovementsGalleryUITests.swift'
      - 'Tests/FactoryMCPIntegrationTests.swift'
  pull_request:
    branches:
      - visual/ios-next-162-v01-v04
    paths:
      - '.github/workflows/xb05-ios-next-xcodebuilds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xb05-ios-next-v01-v04-${{ github.ref }}
  cancel-in-progress: false

jobs:
  xcode27-visual:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'Bambis-Lab/ios-next-build' }}
    uses: Bambis-Lab/XcodeBuilds-/.github/workflows/reusable-ios-next-162-visual.yml@590ddd49145f9559dedb191b993314bd2e4d6161
    with:
      tooling_ref: 590ddd49145f9559dedb191b993314bd2e4d6161
