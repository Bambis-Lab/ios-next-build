name: V6.4 bounded cleanup regression
on:
  push:
    branches: ['feature/ios180-v64-bounded-cleanup']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify timeout and denied process-group signalling
        run: |
          set -euo pipefail
          python3 -m py_compile Scripts/Acceptance/boot_simulator.py Scripts/Acceptance/run_two_native_simulators.py
          python3 Scripts/Acceptance/test_bounded_cleanup.py -v
