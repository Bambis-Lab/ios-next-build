name: iOS Next OPT - bounded acceptance

on:
  push:
    branches:
      - feature/ios-next-opt-01-14-foundation-162
      - acceptance/iosnext-opt-smoke-606b224
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: "Targeted smoke or full iPhone/iPad suite"
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: iosnext-opt-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Static source and scope checks (NO XCODE)
        run: |
          set -euo pipefail
          python3 Scripts/Acceptance/validate_factory_workspace.py
          python3 Scripts/Acceptance/validate_nico_factory_ui.py
          python3 Scripts/Acceptance/validate_opt_foundation.py
          python3 -m py_compile Scripts/Acceptance/xcode_watchdog.py Scripts/Acceptance/boot_simulator.py Scripts/Acceptance/run_xcode_tests_verified.py Scripts/Acceptance/test_run_xcode_tests_verified.py
          python3 -m unittest discover -s Scripts/Acceptance -p 'test_compare_performance.py'
          python3 -m unittest discover -s Scripts/Acceptance -p 'test_run_xcode_tests_verified.py'

  # Normal feature-branch pushes run portable checks only. This exact isolated
  # acceptance branch is allowed to run one bounded smoke; full matrix stays manual.
  xcode27:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/acceptance/iosnext-opt-smoke-606b224')
    needs: portable
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare dependencies and deterministic project
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          bash Scripts/prepare_wireguard_dependency.sh
          export CM_COMMIT="$(git rev-parse HEAD)"
          export EXPECTED_VERSION="1.6.2"
          export EXPECTED_BUILD="25"
          bash Scripts/prepare_free_sideload_project.sh
          mkdir -p build

      - name: Resolve iPhone 18 Pro Max destination (Xcode owns test-time boot)
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/Acceptance/boot_simulator.py "iPhone 18 Pro Max" "iOS-27-0" --resolve-only 2>&1 | tee build/NicoFactoryBoot.log

      - name: Compile once without UI tests (bounded)
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 600 -- xcodebuild -project IOSNext.xcodeproj -scheme IOSNext \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/NicoFactoryDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build-for-testing 2>&1 | tee build/NicoFactoryBuild.log

      - name: Build unsigned device IPA candidate (no signing or release)
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/IOSNext-IPA-Candidate"
          DERIVED="$OUT/DerivedData"
          rm -rf "$OUT"
          mkdir -p "$OUT/ipa-root/Payload"
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 540 -- xcodebuild build \
            -project IOSNext.xcodeproj \
            -scheme IOSNext \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" MARKETING_VERSION=1.6.2 CURRENT_PROJECT_VERSION=25
          APP="$DERIVED/Build/Products/Release-iphoneos/IOSNext.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -x "$APP/$EXEC_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "de.nicofroeba16.iosnext"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.6.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "25"
          test "$(lipo -archs "$APP/$EXEC_NAME")" = "arm64"
          ditto "$APP" "$OUT/ipa-root/Payload/IOSNext.app"
          (cd "$OUT/ipa-root" && zip -qry "../IOSNext-Free-unsigned.ipa" Payload)
          unzip -t "$OUT/IOSNext-Free-unsigned.ipa"
          shasum -a 256 "$OUT/IOSNext-Free-unsigned.ipa" | tee "$OUT/IOSNext-Free-unsigned.sha256"
          stat -f '%z' "$OUT/IOSNext-Free-unsigned.ipa" | tee "$OUT/IOSNext-Free-unsigned.size"
          cat > "$OUT/BUILD_OK.txt" <<EOF
          IOSNEXT_UNSIGNED_IPA_BUILD=PASS
          VERSION=1.6.2
          BUILD=25
          BUNDLE_ID=de.nicofroeba16.iosnext
          ARCH=arm64
          SIGNED=NO
          RELEASE=NO
          SOURCE_COMMIT=$GITHUB_SHA
          EOF
          cat "$OUT/BUILD_OK.txt"

      - name: Upload unsigned IPA candidate (not a release)
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IOSNext-Unsigned-IPA-Candidate
          path: |
            build/IOSNext-IPA-Candidate/IOSNext-Free-unsigned.ipa
            build/IOSNext-IPA-Candidate/IOSNext-Free-unsigned.sha256
            build/IOSNext-IPA-Candidate/IOSNext-Free-unsigned.size
            build/IOSNext-IPA-Candidate/BUILD_OK.txt
          retention-days: 7
          if-no-files-found: error

      - name: Restart iPhone simulator before tests (bounded; no erase)
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 30 -- xcrun simctl shutdown "$SIM_ID" || true
          python3 Scripts/Acceptance/boot_simulator.py "iPhone 18 Pro Max" "iOS-27-0" 2>&1 | tee -a build/NicoFactoryBoot.log

      - name: Targeted iPhone unit tests (bounded; fail fast)
        timeout-minutes: 5
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/NicoFactoryDerivedData/Build/Products/*.xctestrun)
          test "${#files[@]}" -eq 1
          scope=(
            "-only-testing:IOSNextTests/LatestValueCommandQueueTests"
            "-only-testing:IOSNextTests/EntityCommandPipelineTests"
            "-only-testing:IOSNextTests/ChatDraftSafetyTests"
            "-only-testing:IOSNextTests/ChatMediaThumbnailCacheTests"
            "-only-testing:IOSNextTests/HomeAssistantLookupIndexTests"
            "-only-testing:IOSNextTests/GlobalSearchIndexTests"
            "-only-testing:IOSNextTests/DashboardPreferencesTests"
            "-only-testing:IOSNextTests/AppAudioCoordinatorTests"
            "-only-testing:IOSNextTests/FactoryWorkspaceContractsTests"
          )
          if [[ "$SUITE" == "full" ]]; then
            scope+=(
              "-only-testing:IOSNextTests/FactoryWorkspaceCollectionTests"
              "-only-testing:IOSNextTests/FactoryWorkspaceEventsTests"
              "-only-testing:IOSNextTests/FactoryWorkspaceCoordinatorTests"
            )
          fi
          python3 Scripts/Acceptance/run_xcode_tests_verified.py --timeout-seconds 240 \
            --result-bundle build/NicoFactoryiPhone.xcresult \
            --log-file build/NicoFactoryUnitTests.log -- \
            xcodebuild test-without-building -xctestrun "${files[0]}" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO "${scope[@]}" \
            -resultBundlePath build/NicoFactoryiPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Targeted iPhone UI acceptance (separate watchdog budget)
        timeout-minutes: 9
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/NicoFactoryDerivedData/Build/Products/*.xctestrun)
          test "${#files[@]}" -eq 1
          ui_scope=(
            "-only-testing:IOSNextUITests/NicoRoomLayoutUITests/testAccessibilityTypeKeepsActionsAccessible"
          )
          ui_timeout=270
          if [[ "$SUITE" == "full" ]]; then
            ui_scope=(
              "-only-testing:IOSNextUITests/NicoRoomLayoutUITests"
              "-only-testing:IOSNextUITests/FactoryWorkspaceUITests"
            )
            ui_timeout=480
          fi
          python3 Scripts/Acceptance/run_xcode_tests_verified.py --timeout-seconds "$ui_timeout" \
            --result-bundle build/NicoFactoryiPhone-UI.xcresult \
            --log-file build/NicoFactoryUITests.log -- \
            xcodebuild test-without-building -xctestrun "${files[0]}" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO "${ui_scope[@]}" \
            -resultBundlePath build/NicoFactoryiPhone-UI.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Full-suite iPad acceptance (manual full only)
        if: ${{ inputs.suite == 'full' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          IPAD_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          ds=json.load(sys.stdin)["devices"]
          m=[d["udid"] for runtime,devices in ds.items() if "iOS-27" in runtime
             for d in devices if d["name"].startswith("iPad") and d.get("isAvailable",True)]
          assert m,"iOS 27 iPad simulator required"
          print(m[0])
          ')"
          xcrun simctl boot "$IPAD_ID" || true
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 90 -- xcrun simctl bootstatus "$IPAD_ID" -b
          files=(build/NicoFactoryDerivedData/Build/Products/*.xctestrun)
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 240 -- xcodebuild test-without-building -xctestrun "${files[0]}" \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -parallel-testing-enabled NO \
            "-only-testing:IOSNextUITests/NicoRoomLayoutUITests" \
            -resultBundlePath build/NicoFactoryiPad.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Always upload test evidence (including red tests)
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IOSNext-Nico-Factory-OPT-Diagnostics
          path: |
            build/NicoFactoryBoot.log
            build/NicoFactoryBuild.log
            build/NicoFactoryUnitTests.log
            build/NicoFactoryUITests.log
            build/NicoFactoryiPhone.xcresult
            build/NicoFactoryiPhone-UI.xcresult
            build/NicoFactoryiPad.xcresult
          retention-days: 7
          if-no-files-found: warn
