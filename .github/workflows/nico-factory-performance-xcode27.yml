name: iOS Next OPT - bounded acceptance

on:
  push:
    branches:
      - feature/ios-next-opt-01-14-foundation-162
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        description: "Targeted smoke or full iPhone/iPad suite"
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

concurrency:
  group: iosnext-opt-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Static source and scope checks (NO XCODE)
        run: |
          set -euo pipefail
          python3 Scripts/Acceptance/validate_factory_workspace.py
          python3 Scripts/Acceptance/validate_nico_factory_ui.py
          python3 Scripts/Acceptance/validate_opt_foundation.py
          python3 -m py_compile Scripts/Acceptance/xcode_watchdog.py

  # Explicit manual run ONLY, never launched by a feature-branch push.
  # A failed test must not suppress the upload of its .xcresult evidence.
  xcode27:
    if: github.event_name == 'workflow_dispatch'
    needs: portable
    runs-on: xcode-27
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare dependencies and deterministic project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.0"
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          bash Scripts/prepare_wireguard_dependency.sh
          export CM_COMMIT="$(git rev-parse HEAD)"
          export EXPECTED_VERSION="1.6.2"
          export EXPECTED_BUILD="25"
          bash Scripts/prepare_free_sideload_project.sh
          mkdir -p build

      - name: Boot iPhone 18 Pro Max (strict watchdog)
        shell: bash
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          ds=json.load(sys.stdin)["devices"]
          m=[d["udid"] for runtime,devices in ds.items() if "iOS-27-0" in runtime
             for d in devices if d["name"]=="iPhone 18 Pro Max" and d.get("isAvailable",True)]
          assert m,"iOS 27 iPhone 18 Pro Max simulator required"
          print(m[0])
          ')"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 105 -- xcrun simctl bootstatus "$SIM_ID" -b

      - name: Compile once without UI tests (bounded)
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 660 -- \
            xcodebuild -project IOSNext.xcodeproj -scheme IOSNext \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/NicoFactoryDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Targeted iPhone tests (bounded; fail fast)
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/NicoFactoryDerivedData/Build/Products/*.xctestrun)
          test "${#files[@]}" -eq 1
          scope=(
            "-only-testing:IOSNextTests/LatestValueCommandQueueTests"
            "-only-testing:IOSNextTests/FactoryWorkspaceContractsTests"
            "-only-testing:IOSNextUITests/NicoRoomLayoutUITests/testAccessibilityTypeKeepsActionsAccessible"
          )
          if [[ "$SUITE" == "full" ]]; then
            scope=(
              "-only-testing:IOSNextTests/LatestValueCommandQueueTests"
              "-only-testing:IOSNextTests/FactoryWorkspaceContractsTests"
              "-only-testing:IOSNextTests/FactoryWorkspaceCoordinatorTests"
              "-only-testing:IOSNextUITests/NicoRoomLayoutUITests"
              "-only-testing:IOSNextUITests/FactoryWorkspaceUITests"
            )
          fi
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 240 -- \
            xcodebuild test-without-building -xctestrun "${files[0]}" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO "${scope[@]}" \
            -resultBundlePath build/NicoFactoryiPhone.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Full-suite iPad acceptance (manual full only)
        if: ${{ inputs.suite == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          IPAD_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          ds=json.load(sys.stdin)["devices"]
          m=[d["udid"] for runtime,devices in ds.items() if "iOS-27" in runtime
             for d in devices if d["name"].startswith("iPad") and d.get("isAvailable",True)]
          assert m,"iOS 27 iPad simulator required"
          print(m[0])
          ')"
          xcrun simctl boot "$IPAD_ID" || true
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 90 -- xcrun simctl bootstatus "$IPAD_ID" -b
          files=(build/NicoFactoryDerivedData/Build/Products/*.xctestrun)
          python3 Scripts/Acceptance/xcode_watchdog.py --timeout-seconds 240 -- \
            xcodebuild test-without-building -xctestrun "${files[0]}" \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -parallel-testing-enabled NO \
            "-only-testing:IOSNextUITests/NicoRoomLayoutUITests" \
            -resultBundlePath build/NicoFactoryiPad.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Always upload test evidence (including red tests)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IOSNext-Nico-Factory-OPT-Diagnostics
          path: |
            build/NicoFactoryiPhone.xcresult
            build/NicoFactoryiPad.xcresult
          retention-days: 7
          if-no-files-found: warn
